name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests and deployment checks
    runs-on: ubuntu-latest
    env:
      # Needed by both steps below. SECRET_KEY is generated per run in a step
      # further down — no secret material is stored in this file.
      # The console backend keeps the "email not configured" warning out of CI.
      EMAIL_BACKEND: console
      ALLOWED_HOSTS: armin2080.de,www.armin2080.de
      # Obvious dummies: settings.py only requires these to be non-empty and to
      # not be the placeholders from .env.example.
      RECAPTCHA_PUBLIC_KEY: ci-placeholder-not-a-real-key
      RECAPTCHA_PRIVATE_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate a throwaway SECRET_KEY
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"

      # Run against production-like settings (captcha enforced, DEBUG off) so CI
      # exercises the same code paths as the Pi. SECURE_SSL_REDIRECT is disabled
      # here only because the Django test client speaks plain HTTP.
      - name: Run tests
        env:
          DEBUG: 'False'
          SECURE_SSL_REDIRECT: 'False'
        run: python manage.py test

      # Deliberately does not set SECURE_SSL_REDIRECT: the check must see the
      # real production value (True) or it reports security.W008.
      - name: Run deployment checks
        env:
          DEBUG: 'False'
        run: python manage.py check --deploy --fail-level WARNING

  css:
    name: CSS bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Caching the CLI avoids re-downloading it (and hitting the release CDN)
      # on every run. Bump the key when TAILWIND_VERSION changes.
      - name: Cache the Tailwind CLI
        uses: actions/cache@v6
        with:
          path: .tailwind
          key: tailwind-cli-${{ runner.os }}-${{ runner.arch }}-3.4.17

      - name: Rebuild Tailwind and compare
        run: |
          ./scripts/build-css.sh
          git diff --exit-code -- static/css/tailwind.css
